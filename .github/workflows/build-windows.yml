name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Check Python bootstrap regressions (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/windows/test_bootstrap.ps1
      - name: Build and check standalone executable
        shell: cmd
        run: build.bat --ci
      - name: Smoke test real GUI with offline data
        shell: cmd
        run: |
          set DISPLAY=windows
          .build-venv\Scripts\python.exe -m unittest tests.test_ui -v
      - uses: actions/upload-artifact@v4
        with:
          name: YouTubeLinkConverter-windows-x64
          path: |
            dist/YouTubeLinkConverter.exe
            dist/self-check.json
          if-no-files-found: error

  bootstrap-without-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise official Python install when discovery finds no runtime
        shell: powershell
        run: ./tests/windows/test_bootstrap_install.ps1
